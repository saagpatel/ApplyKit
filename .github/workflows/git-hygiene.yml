name: git-hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, master]
  workflow_dispatch:

jobs:
  git-hygiene:
    # A called workflow cannot hold more permission than its caller grants.
    # This repo's default workflow token is "read", which covers contents and
    # packages but not pull-requests, so the call was rejected before any job
    # was prepared - a startup failure with no job and no log to read.
    permissions:
      contents: read
      pull-requests: read
    uses: saagpatel/sovereign/.github/workflows/git-hygiene.yml@f27de0d13192c0ae42e94cdec85b8c224971bc8a
