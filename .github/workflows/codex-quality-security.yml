name: codex-quality-security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable as of 2026-10-06
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile || pnpm install
          fi
          if [ -f ui/package.json ]; then
            pnpm -C ui install --frozen-lockfile || pnpm -C ui install
          fi
      - name: Ensure cargo-audit when required
        run: |
          if grep -q "cargo audit" .codex/verify.commands; then
            cargo install cargo-audit --locked
          fi
      - name: Ensure cargo-llvm-cov when required
        run: |
          if grep -q "run_coverage.sh" .codex/verify.commands; then
            cargo install cargo-llvm-cov --locked
          fi
      - name: Ensure Tauri CLI when required
        run: |
          if grep -q "cargo tauri build" .codex/verify.commands; then
            cargo install tauri-cli --version "^2.0" --locked
          fi
      - name: Ensure Playwright browser when required
        run: |
          if grep -q "test:e2e:a11y" .codex/verify.commands; then
            pnpm -C ui exec playwright install chromium
          fi
      - name: Run canonical repo gates
        run: bash ./.codex/scripts/run_verify_commands.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@cc79781233d21ea039252e8af972a3f62df6cce2 # main as of 2026-10-06
        with:
          extra_args: --results=verified,unknown

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1 as of 2026-10-06
        with:
          config: p/default

  dependency_and_misconfig:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  scorecard:
    if: github.event_name == 'schedule'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
