packages:
  - ui

# Prefer a ranged floor ("pkg@<fixed": fixed) over an exact pin. A floor only
# rewrites versions that are actually vulnerable and lets the ecosystem move
# forward; an exact pin freezes the package and silently becomes the next
# advisory, which is what happened to postcss between 2026-07-04 and 2026-08-11.
# Ranges are scoped to the affected major so an override never crosses a
# breaking boundary.
overrides:
  "@babel/core": 7.29.6
  "ajv@<6.14.0": 6.14.0
  "baseline-browser-mapping@>=2.0.0 <2.11.0": 2.11.0
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "browserslist@>=4.0.0 <4.28.7": 4.28.7
  "esbuild": 0.28.1
  "expect@>=30.0.0 <30.3.0": 30.3.0
  "flatted@<3.4.2": 3.4.2
  "minimatch@<3.1.4": 3.1.4
  "minimatch@>=9.0.0 <9.0.7": 9.0.7
  "nanoid@>=3.0.0 <3.3.17": 3.3.17
  "picomatch@2.3.1": 2.3.2
  "picomatch@4.0.3": 4.0.4
  "postcss@>=8.0.0 <8.5.23": 8.5.23
  "rollup@<4.59.0": 4.59.0
  "undici@>=7.0.0 <7.29.0": 7.29.0
  "undici@>=8.0.0 <8.10.2": 8.10.2
